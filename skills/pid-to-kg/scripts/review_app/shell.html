<title>Process Atlas | Drawing review</title>

<body>
<header id="topbar">
  <a class="brand" href="#/home" aria-label="Process Atlas home"><span class="brand-mark" aria-hidden="true"></span><span class="brand-name">Process Atlas</span></a>
  <div class="plant"><span id="plant-name"></span><span id="plant-meta" class="dim"></span></div>
  <button id="open-palette" class="searchbar" type="button" aria-label="Search assets, sheets, loops and issues"><span class="searchbar-text">Find a tag, asset, sheet or loop</span><kbd id="palette-key">/</kbd></button>
  <div class="top-actions">
    <button id="help-btn" class="icon-btn" type="button" title="Keyboard shortcuts (?)" aria-label="Keyboard shortcuts">?</button>
    <button id="theme-btn" class="icon-btn" type="button" title="Switch light / dark (T)" aria-label="Switch theme"></button>
    <button id="inspector-btn" class="icon-btn" type="button" title="Show or hide the inspector (I)" aria-label="Toggle inspector"></button>
  </div>
</header>
<nav id="rail" aria-label="Views"></nav>
<main id="main" tabindex="-1"></main>
<aside id="inspector" aria-label="Selected item"></aside>
<div id="palette" class="overlay" hidden>
  <div class="palette-box" role="dialog" aria-modal="true" aria-label="Search">
    <input id="palette-input" type="text" autocomplete="off" spellcheck="false" aria-label="Search" aria-controls="palette-results">
    <div id="palette-hint" class="palette-hint"></div>
    <div id="palette-results" role="listbox"></div>
    <div class="palette-foot"><span><kbd>↑</kbd><kbd>↓</kbd> move</span><span><kbd>Enter</kbd> open</span><span><kbd>Esc</kbd> close</span></div>
  </div>
</div>
<div id="help" class="overlay" hidden><div class="help-box" role="dialog" aria-modal="true" aria-label="Keyboard shortcuts"></div></div>
<div id="tooltip" role="tooltip" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
